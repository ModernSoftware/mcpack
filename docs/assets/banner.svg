<g font-family="DejaVu Sans,Arial,sans-serif">
<g transform="translate(52 42)" fill="none" stroke="url(#accent)" stroke-width="3"><path d="M0 16 28 0 56 16 28 32Z"/><path d="m0 28 28 16 28-16M0 40l28 16 28-16"/></g>
