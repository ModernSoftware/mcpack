<text x="52" y="210" fill="#ffffff" font-size="42" font-weight="700">One manifest.</text><text x="52" y="264" fill="#ffffff" font-size="42" font-weight="700">Multiple runtimes.</text><text x="52" y="318" fill="url(#accent)" font-size="42" font-weight="700">Standard MCP.</text>
