<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">MCPack — One manifest. Multiple runtimes. Standard MCP.</title>
<desc id="desc">Modern Software's native MCP runtime for Node and Python, with persistent workers and HTTP or stdio serving.</desc>
