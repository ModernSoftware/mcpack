name: Stage npm release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install staging-capable npm
        run: npm install --global npm@11.15.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:package
      - name: Validate release and select channel
        id: release
        run: npm run release:check -- --publish --github-output
      - name: Stage using npm trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm stage publish --tag "$NPM_DIST_TAG"
      - name: Explain maintainer approval
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## npm candidate staged; approval required
          This workflow has not made the package public. Open npm's **Staged Packages**,
          verify the version and artifact, then approve with 2FA.
          Alternatively, use `npm stage list @modern-software/mcpack`,
          `npm stage view <stage-id>`, and `npm stage approve <stage-id>` on your machine.
          If a retry reports that the version exists, inspect staged and published versions
          before retrying. Do not approve a different artifact merely to unblock CI.
          EOF
