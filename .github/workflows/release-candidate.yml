name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:package
      - run: npm run release:check
      - run: npm run benchmark -- --iterations 100 --output .release/benchmark.json
      - run: npm pack --pack-destination .release
      - name: Record package digest
        run: sha256sum .release/*.tgz > .release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mcpack-release-candidate
          path: .release/
          include-hidden-files: true
